<!doctype html>
<!-- site/apple-touch-icon.png (180 x 180): the iOS app icon, design/icon/icon-ios.svg, at the size iOS asks a web page for.
     Render: Chrome --headless=new --hide-scrollbars --screenshot=site/apple-touch-icon.png --window-size=180,180 "file://$PWD/design/site/touch-icon.html" -->
<html lang="en">
<head><meta charset="utf-8"><style>html, body { margin: 0; width: 180px; height: 180px; overflow: hidden; } img { display: block; width: 180px; height: 180px; }</style></head>
<body><img src="../icon/icon-ios.svg" alt=""></body>
</html>
